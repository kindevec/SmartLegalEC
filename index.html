    <!-- Smart Theme-Adaptive Dynamic Favicon -->
    <link id="dynamic-favicon" rel="icon" type="image/png" href="/favicon-light.png" />
    <link id="dynamic-apple-icon" rel="apple-touch-icon" href="/favicon-light.png" />
    <script>
      (function() {
        function applySmartFavicon(e) {
          try {
            var isDark = e && typeof e.matches === 'boolean' ? e.matches : window.matchMedia('(prefers-color-scheme: dark)').matches;
            var favicon = document.getElementById('dynamic-favicon');
            var appleIcon = document.getElementById('dynamic-apple-icon');
            var iconPath = isDark ? '/favicon-dark.png' : '/favicon-light.png';
            if (favicon) favicon.setAttribute('href', iconPath);
            if (appleIcon) appleIcon.setAttribute('href', iconPath);
          } catch(err) {}
        }
        var mql = window.matchMedia('(prefers-color-scheme: dark)');
        applySmartFavicon(mql);
        if (mql.addEventListener) {
          mql.addEventListener('change', applySmartFavicon);
        } else if (mql.addListener) {
          mql.addListener(applySmartFavicon);
        }
      })();
    </script>
